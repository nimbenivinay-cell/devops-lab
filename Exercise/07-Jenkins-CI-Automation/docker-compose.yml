services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Mount Docker socket if Docker-in-Docker / Docker-outside-Docker is desired
      # - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
