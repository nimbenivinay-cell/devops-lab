global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "delivery_service"
    static_configs:
      # Use host.docker.internal for cross-platform container-to-host access
      # On Linux host-network or Docker bridge, use container name or host IP (e.g. 172.17.0.1:8000)
      - targets: ["host.docker.internal:8000", "delivery_metrics:8000", "localhost:8000"]
